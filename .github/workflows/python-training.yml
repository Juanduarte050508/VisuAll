name: Python Training

# Cobre o lado Python (captura + extração + treino), que até agora não tinha
# nenhuma verificação automática -- só o app Android tinha. Foi por isso que
# um modelo passou a ser salvo num caminho que o app não lê mais e ninguém
# percebeu até alguém abrir o código na mão.
on:
  push:
    branches: ["**"]
    paths:
      - "treinamento/**"
      - "linear/**"
      - "modular/**"
      - "requirements.txt"
      - ".github/workflows/python-training.yml"
  pull_request:
    paths:
      - "treinamento/**"
      - "linear/**"
      - "modular/**"
      - "requirements.txt"
      - ".github/workflows/python-training.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Instala o requirements.txt INTEIRO de propósito, mesmo sendo mais
      # lento: as versões de mediapipe/onnx/protobuf só brigam entre si num
      # ambiente completo, e é exatamente esse conflito que já quebrou a
      # instalação do zero uma vez.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check every Python file still parses
        run: python -m compileall -q treinamento linear modular

      # O conflito real que motivou os pinos no requirements.txt: com
      # protobuf>=4 o mediapipe importa mas estoura ao criar qualquer
      # detector, então importar não basta -- tem que criar um de verdade.
      - name: Smoke test - MediaPipe detector actually starts
        run: |
          python - <<'PY'
          import numpy as np, mediapipe as mp
          from mediapipe.tasks.python import vision
          from mediapipe.tasks.python.core.base_options import BaseOptions

          detector = vision.HandLandmarker.create_from_options(
              vision.HandLandmarkerOptions(
                  base_options=BaseOptions(
                      model_asset_path="mobile/app/src/main/assets/hand_landmarker.task"),
                  running_mode=vision.RunningMode.IMAGE,
                  num_hands=1,
              )
          )
          image = mp.Image(
              image_format=mp.ImageFormat.SRGB,
              data=np.zeros((240, 320, 3), dtype=np.uint8),
          )
          detector.detect(image)
          detector.close()
          print("MediaPipe OK")
          PY

      - name: Smoke test - ONNX export stack loads
        run: |
          python - <<'PY'
          import skl2onnx, onnx, google.protobuf
          print("skl2onnx", skl2onnx.__version__, "onnx", onnx.__version__,
                "protobuf", google.protobuf.__version__)
          PY

      - name: Run training pipeline tests
        run: python -m unittest discover -s treinamento/tests -v
