plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
}

android {
    namespace 'com.visuall.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.visuall.app"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    buildFeatures {
        viewBinding true
        dataBinding false
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE.md','META-INF/LICENSE-notice.md',
                         'META-INF/DEPENDENCIES','META-INF/*.kotlin_module']
        }
        jniLibs {
            pickFirsts += ['lib/arm64-v8a/libc++_shared.so','lib/x86_64/libc++_shared.so',
                           'lib/armeabi-v7a/libc++_shared.so','lib/x86/libc++_shared.so']
        }
    }

    sourceSets {
        androidTest.java.srcDirs = []
        test.java.srcDirs = []
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    def camerax = "1.3.1"
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation "androidx.camera:camera-video:$camerax"

    implementation 'com.google.mediapipe:tasks-vision:0.10.14'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.18.0'
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    implementation 'org.tensorflow:tensorflow-lite-select-tf-ops:2.16.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
