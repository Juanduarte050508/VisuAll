org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# NAO coloque org.gradle.java.home aqui. Este arquivo e versionado e vale pra
# todo mundo, entao um caminho de JDK de uma maquina especifica quebra a build
# das outras -- e quebra o CI, que roda em Linux e nao tem "C:\Program Files".
# Foi o que aconteceu: a linha ficou aqui desde a criacao do arquivo e o
# workflow do Android nunca conseguiu passar.
#
# Como apontar o JDK, se precisar:
#   - Android Studio: nada a fazer. Ele usa o JDK de
#     Settings > Build Tools > Gradle, independente deste arquivo.
#   - Linha de comando (./gradlew): defina a variavel de ambiente JAVA_HOME.
#     Isso e obrigatorio de qualquer forma -- o script gradlew precisa de Java
#     pra iniciar ANTES de conseguir ler este arquivo, entao por aqui nao teria
#     como resolver.
#     Ex. (Git Bash):  JAVA_HOME="/c/Program Files/Android/Android Studio/jbr" ./gradlew assembleDebug
