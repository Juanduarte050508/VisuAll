plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
}

android {
    namespace 'com.visuall.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.visuall.app"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.2"
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86"
        }
    }

    buildFeatures {
        viewBinding true
        dataBinding false
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE.md','META-INF/LICENSE-notice.md',
                         'META-INF/DEPENDENCIES','META-INF/*.kotlin_module']
        }
        jniLibs {
            pickFirsts += ['lib/arm64-v8a/libc++_shared.so',
                           'lib/armeabi-v7a/libc++_shared.so','lib/x86/libc++_shared.so']
        }
    }

    sourceSets {
        androidTest.java.srcDirs = []
        test.java.srcDirs = ['src/test/java']
    }
}

// O LandmarkContractTest le tests/fixtures/landmark_contract.json (fora do
// modulo, compartilhado com os testes Python). Sem declarar isso como entrada,
// o Gradle considera o teste "atualizado" quando so as fixtures mudam e nao
// roda de novo -- ou seja, o contrato poderia sair de sincronia sem ninguem
// perceber, que e exatamente o que esse teste existe pra evitar.
tasks.withType(Test).configureEach {
    inputs.file(rootProject.file('../tests/fixtures/landmark_contract.json'))
        .withPropertyName('landmarkContractFixtures')
        .withPathSensitivity(PathSensitivity.RELATIVE)
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    def camerax = "1.3.1"
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation "androidx.camera:camera-video:$camerax"

    implementation 'com.google.mediapipe:tasks-vision:0.10.14'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.18.0'
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    implementation 'org.tensorflow:tensorflow-lite-select-tf-ops:2.16.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    testImplementation 'junit:junit:4.13.2'
    // O org.json que vem no android.jar e so um esqueleto: em teste JVM todo
    // metodo lanca "Stub!". Esta dependencia poe a implementacao de verdade no
    // classpath de teste (so de teste), pro LandmarkContractTest conseguir ler
    // o arquivo de fixtures compartilhado com o Python.
    testImplementation 'org.json:json:20231013'
}


